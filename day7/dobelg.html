<!DOCTYPE html>
<html>
<body>
<script>
for (let i = 1; i <= 10; i++) {
  if (i % 2 === 0) {
    document.write("<span style='color: blue;'>Angka genap: " + i + "</span><br>");
  } else {
    document.write("<span style='color: red;'>Angka ganjil: " + i + "</span><br>");
  }
}
</script>
</body>
</html>
