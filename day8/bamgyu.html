<!DOCTYPE html>
<html>
<body>
<script>
  // Minta user masukin nama
  let nama = prompt("Siapa namamu?");

  // Cek kalau nama = Beomgyu, kasih pesan spesial
  if (nama.toLowerCase() === "beomgyu") {
    document.write("✨ Annyeong Beomgyu Oppa 🐻💖 Kamu bias terbaik TXT! ✨");
  } else {
    document.write("Halo, " + nama + "! Senang kenalan denganmu 😊");
  }
</script>
</body>
</html>
