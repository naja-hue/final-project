<!DOCTYPE html>
<html>
<head>
  <title>Tugas Nama dan Hobi</title>
</head>
<body>
<script>
  let nama = prompt("Siapa namamu?");
  let umur = prompt("Berapa umurmu?")
  let hobi = prompt("Apa hobimu?");
  let alamat = prompt("Dimana rumahmu?")
  let cita = prompt("Cita-cita mu apa?")
  let idola = prompt("Siapa idolamu?")

  document.write("<h2 style= 'color: red;'>Halo, " + nama + "!</h2>");
  document.write("<p style= 'color: brown;'>Umurmu " + umur + "</p>")
  document.write("<p style= 'color: silver;'>Hobimu adalah: " + hobi + "</p>");
  document.write("<p style= 'color: purple;'>Rumahmu di " + alamat + "</p>")
  document.write("<p style= 'color: lavender;'>Cita-citamu adalah " + cita + "</p>")
  document.write("<p style= 'color: magenta;'>Idolamu adalah " + idola + "</p>")
</script>
</body>
</html>
