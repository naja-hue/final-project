<!DOCTYPE html>
<html>
<head>
  <title></title>
</head>
<body>
<script>
  for (let i = 1; i <= 20; i++) {
    if (i % 2 === 0) {
      document.write("<span style='color: blue;'>" + i + " adalah GENAP</span><br>");
    } else {
      document.write("<span style='color: red;'>" + i + " adalah GANJIL</span><br>");
    }
  }
</script>
</body>
</html>
